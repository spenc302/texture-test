name: Package texture-test LFS asset

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository and Git LFS files
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify the real texture pack was downloaded
        shell: bash
        run: |
          FILE="MajorasMask_UnrealInspired_FullReskin/MajorasMask_UnrealInspired_Environment.o2r"
          test -f "$FILE"
          SIZE=$(stat -c%s "$FILE")
          echo "Downloaded file size: $SIZE bytes"
          if [ "$SIZE" -lt 100000000 ]; then
            echo "::error::File is too small; Git LFS pointer may have been downloaded instead."
            exit 1
          fi

      - name: Package texture pack as ZIP
        shell: bash
        run: |
          FILE="MajorasMask_UnrealInspired_FullReskin/MajorasMask_UnrealInspired_Environment.o2r"
          zip -0 -j texture-pack.zip "$FILE"
          ls -lh texture-pack.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: texture-pack-zip
          path: texture-pack.zip
          if-no-files-found: error
          retention-days: 3
