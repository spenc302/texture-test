name: Build Quest texture pack from PackBuild sources

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/build_texture_pack.py'
      - 'tests/test_build_texture_pack.py'
      - 'MajorasMask_UnrealInspired_FullReskin/PackBuild/**'
      - 'MajorasMask_UnrealInspired_FullReskin/Overrides_Manifest.json'
      - '.github/workflows/package-lfs-texture.yml'
  push:
    branches: [main]
    paths:
      - 'tools/build_texture_pack.py'
      - 'tests/test_build_texture_pack.py'
      - 'MajorasMask_UnrealInspired_FullReskin/PackBuild/**'
      - 'MajorasMask_UnrealInspired_FullReskin/Overrides_Manifest.json'
      - '.github/workflows/package-lfs-texture.yml'

concurrency:
  group: texture-pack-build-\${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out PackBuild sources and manifest
        uses: actions/checkout@v4
        # Deliberately no Git LFS checkout and no old O2R template.

      - name: Fetch legacy O2R for weapon-only fallback
        run: |
          git lfs install --local
          git lfs pull --include="MajorasMask_UnrealInspired_FullReskin/MajorasMask_UnrealInspired_Environment.o2r"
          test -s MajorasMask_UnrealInspired_FullReskin/MajorasMask_UnrealInspired_Environment.o2r
          ! grep -q "version https://git-lfs.github.com/spec/v1" MajorasMask_UnrealInspired_FullReskin/MajorasMask_UnrealInspired_Environment.o2r

      - name: Check out Majora's Mask N64 extraction metadata
        uses: actions/checkout@v4
        with:
          repository: 2ship2harkinian/2ship2harkinian
          ref: develop
          path: decomp
          sparse-checkout: |
            mm/assets/xml/N64_US
            mm/src
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PNG decoder
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Run builder regression tests
        run: python -m unittest discover -s tests -v

      - name: Build a fresh O2R from manifest and PNGs
        run: |
          python tools/build_texture_pack.py \
            --packbuild MajorasMask_UnrealInspired_FullReskin/PackBuild \
            --manifest MajorasMask_UnrealInspired_FullReskin/Overrides_Manifest.json \
            --decomp-assets decomp/mm/assets/xml/N64_US \
            --decomp-source-root decomp/mm \
            --fallback-archive MajorasMask_UnrealInspired_FullReskin/MajorasMask_UnrealInspired_Environment.o2r \
            --unresolved-report unresolved-texture-formats.txt \
            --output texture-pack-v1.o2r

      - name: Verify generated O2R
        shell: bash
        run: |
          test -s texture-pack-v1.o2r
          python -m zipfile -t texture-pack-v1.o2r
          ls -lh texture-pack-v1.o2r
          sha256sum texture-pack-v1.o2r

      - name: Publish O2R as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: texture-pack-v1-o2r
          path: |
            texture-pack-v1.o2r
            unresolved-texture-formats.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
