name: Build converted Quest texture pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/upgrade_otex_v0_to_v1.py'
      - '.github/workflows/package-lfs-texture.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository and Git LFS files
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check out authoritative N64 texture format definitions
        uses: actions/checkout@v4
        with:
          repository: zeldaret/mm
          ref: 710e1a7d50a1f987f5fc55abca37f7fdcc8ee43d
          path: mm-decomp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify source O2R was downloaded from Git LFS
        shell: bash
        run: |
          SOURCE="MajorasMask_UnrealInspired_FullReskin/MajorasMask_UnrealInspired_Environment.o2r"
          test -f "$SOURCE"
          SIZE=$(stat -c%s "$SOURCE")
          echo "Source O2R size: $SIZE bytes"
          if [ "$SIZE" -lt 100000000 ]; then
            echo "::error::Source is too small; Git LFS pointer may have been checked out instead."
            exit 1
          fi
          python -m zipfile -t "$SOURCE"

      - name: Convert OTEX V0 RGBA32 resources to V1
        run: |
          python tools/upgrade_otex_v0_to_v1.py \
            MajorasMask_UnrealInspired_FullReskin/MajorasMask_UnrealInspired_Environment.o2r \
            texture-pack-v1.o2r \
            --manifest MajorasMask_UnrealInspired_FullReskin/Overrides_Manifest.json \
            --decomp-assets mm-decomp/assets/xml

      - name: Verify converted O2R archive
        shell: bash
        run: |
          test -s texture-pack-v1.o2r
          python -m zipfile -t texture-pack-v1.o2r
          ls -lh texture-pack-v1.o2r
          sha256sum texture-pack-v1.o2r

      - name: Publish converted O2R as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: texture-pack-v1-o2r
          path: texture-pack-v1.o2r
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
