name: Build Quest texture pack directly from PackBuild

# Keep large LFS-based pack builds serialized. A newer push supersedes an older run.
concurrency:
  group: texture-pack-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/build_texture_pack.py'
      - 'tools/repair_indexed_texture_palettes.py'
      - 'OriginalGameData/indexed_texture_repair_index.json'
      - 'tests/test_build_texture_pack.py'
      - 'MajorasMask_UnrealInspired_FullReskin/PackBuild/**'
      - 'MajorasMask_UnrealInspired_FullReskin/Overrides_Manifest.json'
      - 'MajorasMask_UnrealInspired_FullReskin/MajorasMask_UnrealInspired_Environment.o2r'
      - '.github/workflows/package-lfs-texture.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository and Git LFS files
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check out authoritative Majora's Mask texture format XML
        uses: actions/checkout@v4
        with:
          repository: zeldaret/mm
          ref: 710e1a7d50a1f987f5fc55abca37f7fdcc8ee43d
          path: decomp
          sparse-checkout: |
            assets/xml
            src
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PNG decoder
        run: python -m pip install --disable-pip-version-check Pillow numpy

      - name: Download pinned 2Ship per-resource texture metadata
        run: |
          curl --fail --location --retry 3 --output 2ship-texture-metadata.json \
            "https://raw.githubusercontent.com/GhostlyDark/MM-Reloaded/6750fb02b3ee22a9d3b0ec617cd24fd639191d26/ZELDA%20MAJORA'S%20MASK/Ports/2%20Ship%202%20Harkinian/manifest.json"
          python -c "import json; d=json.load(open('2ship-texture-metadata.json')); print(f'Loaded {len(d):,} 2Ship texture metadata records')"

      - name: Run direct-builder regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify source O2R template was downloaded from Git LFS
        shell: bash
        run: |
          SOURCE="MajorasMask_UnrealInspired_FullReskin/MajorasMask_UnrealInspired_Environment.o2r"
          test -f "$SOURCE"
          SIZE=$(stat -c%s "$SOURCE")
          echo "Source O2R size: $SIZE bytes"
          if [ "$SIZE" -lt 100000000 ]; then
            echo "::error::Source is too small; Git LFS pointer may have been checked out instead."
            exit 1
          fi
          python -m zipfile -t "$SOURCE"

      - name: Restore indexed fallback colours from original game palettes
        run: |
          python tools/repair_indexed_texture_palettes.py \
            --source-o2r MajorasMask_UnrealInspired_FullReskin/MajorasMask_UnrealInspired_Environment.o2r \
            --packbuild MajorasMask_UnrealInspired_FullReskin/PackBuild \
            --index OriginalGameData/indexed_texture_repair_index.json

      - name: Build final OTEX V1 O2R directly from PackBuild PNGs
        run: |
          python tools/build_texture_pack.py \
            --source-o2r MajorasMask_UnrealInspired_FullReskin/MajorasMask_UnrealInspired_Environment.o2r \
            --packbuild MajorasMask_UnrealInspired_FullReskin/PackBuild \
            --manifest MajorasMask_UnrealInspired_FullReskin/Overrides_Manifest.json \
            --decomp-assets decomp/assets/xml \
            --port-metadata 2ship-texture-metadata.json \
            --output texture-pack-v1.o2r

      - name: Verify final O2R archive
        shell: bash
        run: |
          test -s texture-pack-v1.o2r
          python -m zipfile -t texture-pack-v1.o2r
          ls -lh texture-pack-v1.o2r
          sha256sum texture-pack-v1.o2r

      - name: Publish final O2R as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: texture-pack-v1-o2r
          path: texture-pack-v1.o2r
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
