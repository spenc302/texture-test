name: Build Retro-native Majora's Mask texture pack

on:
  workflow_dispatch:
  push:
    branches: [main, build-o2r-from-packbuild]
    paths:
      - 'tools/build_retro_texture_pack.dart'
      - 'MajorasMask_UnrealInspired_FullReskin/PackBuild/**'
      - 'MajorasMask_UnrealInspired_FullReskin/Retro_Source_Manifest.json'
      - 'MajorasMask_UnrealInspired_FullReskin/Retro_Texture_Manifest.json'
      - '.github/workflows/package-lfs-texture.yml'

concurrency:
  group: retro-texture-pack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out texture sources
        uses: actions/checkout@v4

      - name: Check out pinned Retro source
        uses: actions/checkout@v4
        with:
          repository: HarbourMasters/retro
          ref: 43c8e91228333c2bbd1f4cdb66433a205ee9ade2
          path: retro

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Retro dependencies
        working-directory: retro
        run: flutter pub get

      - name: Build using Retro's texture conversion code
        working-directory: retro
        run: |
          mkdir -p tool
          cp ../tools/build_retro_texture_pack.dart tool/build_texture_pack.dart
          dart run tool/build_texture_pack.dart \
            --source-root "$GITHUB_WORKSPACE/MajorasMask_UnrealInspired_FullReskin" \
            --metadata "$GITHUB_WORKSPACE/MajorasMask_UnrealInspired_FullReskin/Retro_Texture_Manifest.json" \
            --output "$GITHUB_WORKSPACE/texture-pack-retro-native.o2r"

      - name: Verify archive and resource headers
        run: |
          python - <<'PY'
          import struct
          import zipfile

          path = "texture-pack-retro-native.o2r"
          with zipfile.ZipFile(path) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC failure: {bad}")
              names = archive.namelist()
              if len(names) != 13512:
                  raise SystemExit(f"Expected 13512 resources, got {len(names)}")
              if "portVersion" in names:
                  raise SystemExit("Retro patch archive should not add portVersion")
              for name in names:
                  data = archive.read(name)
                  if data[4:8] != b"OTEX":
                      raise SystemExit(f"{name}: invalid OTEX FourCC")
                  if data[12:20] != bytes.fromhex("efbeaddeefbeadde"):
                      raise SystemExit(f"{name}: invalid 64-bit resource ID")
                  if struct.unpack_from("<I", data, 0x14)[0] != 0:
                      raise SystemExit(f"{name}: invalid resource version field")
          print(f"Verified {len(names)} Retro-native texture resources")
          PY
          ls -lh texture-pack-retro-native.o2r
          sha256sum texture-pack-retro-native.o2r

      - name: Publish O2R artifact
        uses: actions/upload-artifact@v4
        with:
          name: texture-pack-retro-native
          path: texture-pack-retro-native.o2r
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
